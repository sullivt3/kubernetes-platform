# Two disposable Linux "servers" for end-to-end testing of machine onboarding and
# Kubernetes installation. See README.md in this directory.
#
#   AUTHORIZED_KEY="$(cat ~/.ssh/kplatform_test.pub)" docker compose -f infrastructure/testing/linux-nodes/docker-compose.yml up -d --build
#
# SSH:  node-1 -> localhost:2221, node-2 -> localhost:2222 (user "platform", passwordless sudo)
name: kplatform-testnodes

x-node: &node
  build: .
  image: kplatform-testnode:ubuntu-24.04
  privileged: true
  cgroup: private
  environment:
    AUTHORIZED_KEY: ${AUTHORIZED_KEY:?set AUTHORIZED_KEY to the public key the platform will use}
  security_opt: ["seccomp=unconfined", "apparmor=unconfined"]
  tmpfs: ["/run", "/run/lock", "/tmp"]
  networks: [nodes]

services:
  node-1:
    <<: *node
    hostname: node-1
    ports: ["2221:22"]
    volumes: ["/lib/modules:/lib/modules:ro", "node1-var:/var"]
  node-2:
    <<: *node
    hostname: node-2
    ports: ["2222:22"]
    volumes: ["/lib/modules:/lib/modules:ro", "node2-var:/var"]

networks:
  nodes:

volumes:
  node1-var:
  node2-var:
