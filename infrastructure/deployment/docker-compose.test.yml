# Isolated local testing services. Start with: bash scripts/test-services.sh up -d --wait
name: kplatform-test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kplatform
      POSTGRES_PASSWORD: ${KPLATFORM_TEST_DB_PASSWORD:?Run scripts/configure-local.py first}
      POSTGRES_DB: kplatform
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kplatform -d kplatform_test"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:56379:6379"
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KPLATFORM_KEYCLOAK_ADMIN_PASSWORD:?Run scripts/configure-local.py first}
      KPLATFORM_TEST_USER_PASSWORD: ${KPLATFORM_TEST_USER_PASSWORD:?Run scripts/configure-local.py first}
      KC_HOSTNAME: http://localhost:18080
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: "-Xms128m -Xmx512m"
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./keycloak/kplatform-realm.json:/opt/keycloak/data/import/kplatform-realm.json:ro
      - keycloak-test-data:/opt/keycloak/data
    mem_limit: 1024m
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q 200'"]
      start_period: 90s
      interval: 5s
      timeout: 5s
      retries: 36

volumes:
  postgres-test-data:
  keycloak-test-data:
